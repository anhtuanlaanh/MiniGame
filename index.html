<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Game: Chiến Lược Phân Phối (Bài 7)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #2a2414, #121212);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #1c1c1e;
      border: 1px solid #333;
      border-radius: 20px;
      width: 100%;
      max-width: 680px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #2c2c30;
      color: #facc15;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 { font-size: 32px; margin-bottom: 12px; color: #fff; }
    .subtitle { color: #a1a1aa; font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
    .subtitle span { color: #facc15; font-weight: 600; }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35); }
    .hidden { display: none !important; }

    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 14px; color: #a1a1aa; }
    .score-pill { background: #27272a; color: #facc15; padding: 4px 12px; border-radius: 999px; font-weight: 700; }
    .progress-bar { height: 6px; background: #27272a; border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
    .progress-fill { height: 100%; background: #f59e0b; width: 0%; transition: width 0.3s; }
    .question-text { font-size: 20px; font-weight: 700; text-align: left; line-height: 1.45; margin-bottom: 20px; color: #fff; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      background: #27272a;
      border: 1.5px solid #3f3f46;
      color: #f4f4f5;
      padding: 14px 18px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s;
    }
    .option-btn:hover { border-color: #f59e0b; background: #2e2a20; }
    .option-letter {
      background: #3f3f46;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 50;
    }
    .modal-box {
      background: #1c1c1e;
      border-radius: 20px;
      width: 100%; max-width: 460px;
      overflow: hidden;
      border: 1px solid #333;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    .modal-header { padding: 16px 20px; font-weight: 700; font-size: 18px; color: #fff; text-align: center; }
    .modal-header.correct { background: #16a34a; }
    .modal-header.wrong { background: #e11d48; }
    .video-wrap {
      background: #000;
      width: 100%;
      height: 270px;
      overflow: hidden;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .explanation-box { padding: 16px 20px; text-align: left; font-size: 14px; line-height: 1.55; color: #d4d4d8; }
    .correct-ans-note { color: #4ade80; font-weight: 600; margin-bottom: 8px; }
    .explain-title { color: #facc15; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 4px; }
    .modal-footer { padding: 0 20px 20px; }
    .btn-next {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    }
    .btn-next.correct { background: #16a34a; }
    .btn-next.wrong { background: #e11d48; }
    .result-score { font-size: 48px; font-weight: 800; color: #facc15; margin: 12px 0; }
  </style>
</head>
<body>

  <div id="start-screen" class="card">
    <div class="badge">ÔN TẬP MARKETING CĂN BẢN</div>
    <h1>Bài 7: Chiến Lược Phân Phối</h1>
    <p class="subtitle">Thử thách kiến thức qua <span>7 câu hỏi trắc nghiệm</span> được tổng hợp từ vở ghi của bạn!</p>
    <button id="btn-start" type="button" class="btn-primary">▶ Bắt Đầu Chơi Ngay</button>
  </div>

  <div id="quiz-screen" class="card hidden">
    <div class="quiz-header">
      <span id="question-counter">Câu 1 / 7</span>
      <span class="score-pill">Điểm: <span id="score-display">0</span></span>
    </div>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <div id="question-text" class="question-text"></div>
    <div id="options-container" class="options"></div>
  </div>

  <div id="result-screen" class="card hidden">
    <div class="badge">HOÀN THÀNH THỬ THÁCH</div>
    <h1>Tổng Kết Điểm Số</h1>
    <div class="result-score"><span id="final-score">0</span> / 70</div>
    <p id="result-comment" class="subtitle"></p>
    <button id="btn-restart" type="button" class="btn-primary">↻ Chơi Lại Từ Đầu</button>
  </div>

  <div id="feedback-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modal-header" class="modal-header"></div>
      <div class="video-wrap">
        <video id="feedback-video" playsinline></video>
      </div>
      <div class="explanation-box">
        <div id="correct-ans-note" class="correct-ans-note"></div>
        <div class="explain-title">📖 Giải thích theo vở ghi:</div>
        <div id="explanation-text"></div>
      </div>
      <div class="modal-footer">
        <button id="btn-next" type="button" class="btn-next">Câu tiếp theo →</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Theo vở ghi, sự khác biệt cơ bản giữa kênh phân phối trực tiếp và kênh phân phối gián tiếp là gì?",
        options: [
          "Kênh trực tiếp chỉ bán cho khách hàng cá nhân, kênh gián tiếp bán cho doanh nghiệp",
          "Kênh gián tiếp có sự tham gia của các trung gian (đại lý cấp 1, nhà bán buôn, nhà bán lẻ), còn kênh trực tiếp lưu thông thẳng từ nhà sản xuất đến người tiêu dùng/khách hàng doanh nghiệp",
          "Kênh trực tiếp bắt buộc phải dùng kho công cộng, còn kênh gián tiếp thì không",
          "Kênh gián tiếp do nhà sản xuất tự vận chuyển toàn bộ hàng hóa"
        ],
        answer: 1,
        explain: "Trong kênh trực tiếp, hàng hóa lưu thông thẳng từ nhà sản xuất (NSX) tới người tiêu dùng cuối cùng hoặc KH doanh nghiệp. Trong kênh gián tiếp, hàng hóa được vận chuyển qua trung gian như đại lý cấp 1, nhà bán buôn, nhà bán lẻ."
      },
      {
        q: "Trong các bên tham gia vào kênh phân phối, nhóm nào thuộc 'Nhóm thành viên chính'?",
        options: [
          "Nhà sản xuất, nhà bán buôn, nhà bán lẻ, đại lý",
          "Các tổ chức tài chính, ngân hàng thương mại",
          "Các kho công cộng và hãng vận tải",
          "Các công ty quảng cáo và nghiên cứu thị trường"
        ],
        answer: 0,
        explain: "Nhóm thành viên chính bao gồm: Nhà sản xuất (NSX), nhà bán buôn, nhà bán lẻ và đại lý. Các tổ chức tài chính, kho công cộng, hãng vận tải thuộc nhóm đơn vị hỗ trợ."
      },
      {
        q: "Điểm khác nhau cốt lõi giữa 'Nhà bán buôn' và 'Đại lý của nhà sản xuất' là gì?",
        options: [
          "Nhà bán buôn chỉ bán cho cá nhân, còn đại lý bán cho tổ chức",
          "Nhà bán buôn không được hưởng hoa hồng, còn đại lý sở hữu toàn bộ hàng hóa",
          "Nhà bán buôn có quyền sở hữu hàng hóa, còn đại lý không có quyền sở hữu hàng hóa mà chỉ thay mặt NSX tìm kiếm, thương lượng KH để hưởng % hoa hồng",
          "Đại lý phải tự bỏ vốn đầu tư kho bãi riêng, còn nhà bán buôn thì không"
        ],
        answer: 2,
        explain: "Nhà bán buôn có quyền sở hữu hàng hóa. Đại lý của NSX là người thay mặt cho NSX tìm kiếm và thương lượng với KH để tạo điều kiện cho quá trình mua bán thuận lợi, đổi lại họ không có quyền sở hữu hàng hóa mà được hưởng % hoa hồng từ giá bán."
      },
      {
        q: "Đơn vị hỗ trợ nào cho thuê không gian lưu trữ hàng tồn kho, giúp doanh nghiệp tiết kiệm chi phí mà không cần tự đầu tư xây dựng kho bãi riêng?",
        options: [
          "Các tổ chức tín dụng trung gian",
          "Các kho công cộng",
          "Các nhà bán lẻ độc lập",
          "Hệ thống đại lý cấp 1"
        ],
        answer: 1,
        explain: "Các kho công cộng cung cấp dịch vụ cho thuê không gian lưu trữ hàng tồn kho, giúp doanh nghiệp tiết kiệm chi phí và không cần tự đầu tư xây dựng kho bãi riêng."
      },
      {
        q: "So với kênh Marketing thông thường, đặc điểm nổi bật của Hệ thống Marketing dọc (VMS) là gì?",
        options: [
          "Các thành viên hoạt động độc lập, rời rạc và tự tối đa hóa lợi nhuận riêng",
          "Không có thành viên nào nắm quyền kiểm soát toàn bộ kênh nên dễ xảy ra mâu thuẫn",
          "Các thành viên liên kết chặt chẽ như một thể thống nhất, hướng tới mục tiêu chung và có một thành viên chủ đạo điều phối để hạn chế tối đa xung đột",
          "Chỉ áp dụng cho các doanh nghiệp vận tải quốc tế như DHL, FedEx"
        ],
        answer: 2,
        explain: "Trong hệ thống MKT dọc, các thành viên liên kết chặt chẽ hoạt động như một thể thống nhất, hướng tới mục tiêu chung để tối ưu hóa hoạt động của toàn hệ thống, có 1 thành viên chủ đạo điều phối (sở hữu hoặc ràng buộc) giúp hạn chế tối đa xung đột."
      },
      {
        q: "Hệ thống Marketing dọc (VMS) bao gồm 3 hình thức nào sau đây?",
        options: [
          "Chiều dọc, chiều ngang và đa kênh",
          "Hình thức công ty, hệ thống quản lý và theo hợp đồng",
          "Bán buôn, bán lẻ và đại lý",
          "Đối thoại, hội đồng đại lý và phân xử hòa giải"
        ],
        answer: 1,
        explain: "Có 3 hình thức MKT dọc được ghi trong bài: Hình thức công ty, Hệ thống quản lý, và Theo hợp đồng."
      },
      {
        q: "Để giảm tối đa và xử lý mâu thuẫn trong kênh phân phối, nhà sản xuất cần thực hiện những biện pháp nào?",
        options: [
          "Cắt giảm hoa hồng và loại bỏ toàn bộ các nhà bán lẻ",
          "Tăng giá bán buôn và ngừng cung cấp hàng cho đại lý",
          "Đối thoại, thành lập hội đồng các đại lý, phân xử và hòa giải",
          "Chuyển toàn bộ sang bán hàng trực tiếp và đóng cửa kho công cộng"
        ],
        answer: 2,
        explain: "Để giảm tối đa mâu thuẫn, nhà sản xuất cần thực hiện các biện pháp: Đối thoại, thành lập hội đồng các đại lý, và phân xử & hòa giải."
      }
    ];

    let currentIdx = 0;
    let score = 0;
    const letters = ["A", "B", "C", "D"];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const modal = document.getElementById("feedback-modal");
    const videoEl = document.getElementById("feedback-video");

    function startGame() {
      currentIdx = 0;
      score = 0;
      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const qObj = questions[currentIdx];
      document.getElementById("question-counter").textContent = `Câu ${currentIdx + 1} / ${questions.length}`;
      document.getElementById("score-display").textContent = score;
      document.getElementById("progress-fill").style.width = `${(currentIdx / questions.length) * 100}%`;
      document.getElementById("question-text").textContent = qObj.q;

      const container = document.getElementById("options-container");
      container.innerHTML = "";
      qObj.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt}</span>`;
        btn.addEventListener("click", () => checkAnswer(idx));
        container.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx) {
      const qObj = questions[currentIdx];
      const isCorrect = selectedIdx === qObj.answer;

      const header = document.getElementById("modal-header");
      const note = document.getElementById("correct-ans-note");
      const nextBtn = document.getElementById("btn-next");

      if (isCorrect) {
        score += 10;
        document.getElementById("score-display").textContent = score;
        header.className = "modal-header correct";
        header.textContent = "🎉 Chính Xác! Ong Vàng Nháy Mắt (+10 điểm)";
        note.textContent = `✔ Đáp án đúng là ${letters[qObj.answer]}: ${qObj.options[qObj.answer]}`;
        nextBtn.className = "btn-next correct";
        videoEl.src = "video_1.mp4";
      } else {
        header.className = "modal-header wrong";
        header.textContent = "😼 Sai Rồi! Mèo Vàng Đang Lườm Kìa!";
        note.textContent = `✔ Đáp án đúng là ${letters[qObj.answer]}: ${qObj.options[qObj.answer]}`;
        nextBtn.className = "btn-next wrong";
        videoEl.src = "video_2.mp4";
      }

      document.getElementById("explanation-text").textContent = qObj.explain;
      nextBtn.textContent = currentIdx === questions.length - 1 ? "Xem Kết Quả →" : "Câu tiếp theo →";

      modal.classList.remove("hidden");
      videoEl.currentTime = 0;
      videoEl.play().catch(() => {});
    }

    function nextQuestion() {
      videoEl.pause();
      modal.classList.add("hidden");
      currentIdx++;
      if (currentIdx < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      document.getElementById("final-score").textContent = score;
      const comment = document.getElementById("result-comment");
      if (score >= 60) {
        comment.textContent = "Xuất sắc! Bạn đã nắm rất chắc toàn bộ kiến thức Bài 7: Chiến lược phân phối.";
      } else if (score >= 40) {
        comment.textContent = "Khá tốt! Ôn lại thêm một chút phần phân loại kênh và xử lý mâu thuẫn là chuẩn bài.";
      } else {
        comment.textContent = "Mèo vàng vẫn đang lườm đấy, đọc lại vở ghi Bài 7 rồi chơi lại nhé!";
      }
    }

    document.getElementById("btn-start").addEventListener("click", startGame);
    document.getElementById("btn-restart").addEventListener("click", startGame);
    document.getElementById("btn-next").addEventListener("click", nextQuestion);
  </script>
</body>
</html>
