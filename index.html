<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Game: Chiến Lược Phân Phối (Bài 7)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #2a2414, #121212);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #1c1c1e;
      border: 1px solid #333;
      border-radius: 20px;
      width: 100%;
      max-width: 680px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #2c2c30;
      color: #facc15;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 { font-size: 32px; margin-bottom: 12px; color: #fff; }
    .subtitle { color: #a1a1aa; font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
    .subtitle span { color: #facc15; font-weight: 600; }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35); }
    .hidden { display: none !important; }

    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 14px; color: #a1a1aa; }
    .score-pill { background: #27272a; color: #facc15; padding: 4px 12px; border-radius: 999px; font-weight: 700; }
    .progress-bar { height: 6px; background: #27272a; border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
    .progress-fill { height: 100%; background: #f59e0b; width: 0%; transition: width 0.3s; }
    .question-text { font-size: 20px; font-weight: 700; text-align: left; line-height: 1.45; margin-bottom: 20px; color: #fff; }
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      background: #27272a;
      border: 1.5px solid #3f3f46;
      color: #f4f4f5;
      padding: 14px 18px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s;
    }
    .option-btn:hover { border-color: #f59e0b; background: #2e2a20; }
    .option-letter {
      background: #3f3f46;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 50;
    }
    .modal-box {
      background: #1c1c1e;
      border-radius: 20px;
      width: 100%; max-width: 460px;
      overflow: hidden;
      border: 1px solid #333;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    .modal-header { padding: 16px 20px; font-weight: 700; font-size: 18px; color: #fff; text-align: center; }
    .modal-header.correct { background: #16a34a; }
    .modal-header.wrong { background: #e11d48; }

    .video-wrap {
      background: #0d0d0f;
      width: 100%;
      height: 290px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-wrap.bee-mode {
      background: radial-gradient(circle at center, #3b3014 0%, #14120c 100%);
    }
    .video-wrap.bee-mode video {
      width: auto;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.75);
    }
    .video-wrap.cat-mode {
      background: #000;
    }
    .video-wrap.cat-mode video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .explanation-box { padding: 16px 20px; text-align: left; font-size: 14px; line-height: 1.55; color: #d4d4d8; }
    .correct-ans-note { color: #4ade80; font-weight: 600; margin-bottom: 8px; }
    .wrong-ans-note { color: #fda4af; font-weight: 600; margin-bottom: 8px; }
    .explain-title { color: #facc15; font-weight: 700; font-size: 12px; text-transform: uppercase; margin-bottom: 4px; }
    .modal-footer { padding: 0 20px 20px; }
    .btn-next {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    }
    .btn-next.correct { background: #16a34a; }
    .btn-next.wrong { background: #e11d48; }
    .result-score { font-size: 48px; font-weight: 800; color: #facc15; margin: 12px 0; }
  </style>
</head>
<body>

  <div id="start-screen" class="card">
    <div class="badge">ÔN TẬP MARKETING CĂN BẢN</div>
    <h1>Bài 7: Chiến Lược Phân Phối</h1>
    <p class="subtitle">Thử thách kiến thức qua <span>7 câu hỏi trắc nghiệm</span> được tổng hợp từ vở ghi của bạn!</p>
    <button id="btn-start" type="button" class="btn-primary">▶ Bắt Đầu Chơi Ngay</button>
  </div>

  <div id="quiz-screen" class="card hidden">
    <div class="quiz-header">
      <span id="question-counter">Câu 1 / 7</span>
      <span class="score-pill">Điểm: <span id="score-display">0</span></span>
    </div>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <div id="question-text" class="question-text"></div>
    <div id="options-container" class="options"></div>
  </div>

  <div id="result-screen" class="card hidden">
    <div class="badge">HOÀN THÀNH THỬ THÁCH</div>
    <h1>Tổng Kết Điểm Số</h1>
    <div class="result-score"><span id="final-score">0</span> / 70</div>
    <p id="result-comment" class="subtitle"></p>
    <button id="btn-restart" type="button" class="btn-primary">↻ Chơi Lại Từ Đầu</button>
  </div>

  <div id="feedback-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modal-header" class="modal-header"></div>
      <div id="video-wrap" class="video-wrap">
        <video id="feedback-video" playsinline></video>
      </div>
      <div class="explanation-box">
        <div id="ans-note" class="correct-ans-note"></div>
        <div id="explain-title" class="explain-title"></div>
        <div id="explanation-text"></div>
      </div>
      <div class="modal-footer">
        <button id="btn-next" type="button" class="btn-next">Câu tiếp theo →</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      {
        q: "Vai trò chính của việc phân phối trong Marketing là gì?",
        options: [
          "Đưa sản phẩm từ nhà sản xuất tới người tiêu dùng cuối cùng",
          "Thiết kế bao bì và logo cho sản phẩm",
          "Tuyển dụng nhân sự cho công ty",
          "Sản xuất nguyên vật liệu thô"
        ],
        answer: 0,
        hint: "Gợi ý: Phân phối giúp vận chuyển và đưa sản phẩm từ nơi sản xuất đến tay người mua.",
        explain: "Vai trò của việc phân phối trong Marketing là đưa sản phẩm tới thị trường mục tiêu, đưa sản phẩm từ nhà sản xuất tới người tiêu dùng cuối cùng."
      },
      {
        q: "Hàng hóa lưu thông trực tiếp từ nhà sản xuất tới người tiêu dùng cuối cùng được gọi là kênh gì?",
        options: [
          "Kênh phân phối gián tiếp",
          "Kênh phân phối trực tiếp",
          "Kênh phân phối đa cấp",
          "Kênh phân phối quốc tế"
        ],
        answer: 1,
        hint: "Gợi ý: Không qua trung gian, đi thẳng từ nhà sản xuất tới người tiêu dùng.",
        explain: "Hàng hóa lưu thông trực tiếp từ nhà sản xuất tới người tiêu dùng cuối cùng hoặc khách hàng doanh nghiệp gọi là kênh phân phối trực tiếp."
      },
      {
        q: "Trong kênh phân phối, đối tượng nào trực tiếp sản xuất ra hàng hóa để cung cấp cho thị trường?",
        options: [
          "Ngân hàng thương mại",
          "Kho công cộng",
          "Nhà sản xuất",
          "Hãng vận tải"
        ],
        answer: 2,
        hint: "Gợi ý: Là bên tạo ra sản phẩm ban đầu trong kênh phân phối.",
        explain: "Nhà sản xuất (NSX) là thành viên chính tạo ra sản phẩm và cung cấp hàng hóa vào kênh phân phối."
      },
      {
        q: "Cơ sở nào tham gia bán hàng hóa trực tiếp cho người tiêu dùng cá nhân hoặc hộ gia đình?",
        options: [
          "Nhà bán lẻ",
          "Kho công cộng",
          "Ngân hàng trung gian",
          "Hãng vận tải"
        ],
        answer: 0,
        hint: "Gợi ý: Các cửa hàng, siêu thị bán trực tiếp từng món cho khách hàng cá nhân.",
        explain: "Nhà bán lẻ gồm tất cả các cơ sở tham gia bán hàng hóa cho người tiêu dùng cá nhân hoặc hộ gia đình."
      },
      {
        q: "DHL, FedEx, TNT, UPS là ví dụ minh họa cho đơn vị hỗ trợ nào trong kênh phân phối?",
        options: [
          "Tổ chức tài chính",
          "Hãng vận tải",
          "Đại lý cấp 1",
          "Nhà bán buôn"
        ],
        answer: 1,
        hint: "Gợi ý: Các đơn vị chuyên giao hàng, chuyển phát nhanh.",
        explain: "Hãng vận tải thực hiện dịch vụ vận chuyển, lưu thông hàng hóa trong kênh phân phối (Ví dụ: DHL, FedEx, TNT, UPS...)."
      },
      {
        q: "Hệ thống Marketing dọc (VMS) có mấy hình thức?",
        options: [
          "2 hình thức",
          "3 hình thức",
          "4 hình thức",
          "5 hình thức"
        ],
        answer: 1,
        hint: "Gợi ý: Gồm hình thức công ty, hệ thống quản lý và theo hợp đồng.",
        explain: "Có 3 hình thức Marketing dọc: Hình thức công ty, Hệ thống quản lý, và Theo hợp đồng."
      },
      {
        q: "Có mấy loại mâu thuẫn trong kênh phân phối được nêu trong bài học?",
        options: [
          "2 loại",
          "3 loại (chiều dọc, chiều ngang, đa kênh)",
          "4 loại",
          "5 loại"
        ],
        answer: 1,
        hint: "Gợi ý: Gồm mâu thuẫn theo chiều dọc, chiều ngang và đa kênh.",
        explain: "Bài học nêu rõ có 3 loại mâu thuẫn: Mâu thuẫn theo chiều dọc, mâu thuẫn theo chiều ngang, và mâu thuẫn đa kênh."
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let isLastAnswerCorrect = false;
    let hasAttemptedCurrent = false;
    const letters = ["A", "B", "C", "D"];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const modal = document.getElementById("feedback-modal");
    const videoWrap = document.getElementById("video-wrap");
    const videoEl = document.getElementById("feedback-video");

    function startGame() {
      currentIdx = 0;
      score = 0;
      hasAttemptedCurrent = false;
      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const qObj = questions[currentIdx];
      document.getElementById("question-counter").textContent = `Câu ${currentIdx + 1} / ${questions.length}`;
      document.getElementById("score-display").textContent = score;
      document.getElementById("progress-fill").style.width = `${(currentIdx / questions.length) * 100}%`;
      document.getElementById("question-text").textContent = qObj.q;

      const container = document.getElementById("options-container");
      container.innerHTML = "";
      qObj.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt}</span>`;
        btn.addEventListener("click", () => checkAnswer(idx));
        container.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx) {
      const qObj = questions[currentIdx];
      isLastAnswerCorrect = selectedIdx === qObj.answer;

      const header = document.getElementById("modal-header");
      const note = document.getElementById("ans-note");
      const explainTitle = document.getElementById("explain-title");
      const explainText = document.getElementById("explanation-text");
      const nextBtn = document.getElementById("btn-next");

      if (isLastAnswerCorrect) {
        if (!hasAttemptedCurrent) {
          score += 10;
        } else {
          score += 5;
        }
        document.getElementById("score-display").textContent = score;
        header.className = "modal-header correct";
        header.textContent = !hasAttemptedCurrent
          ? "🎉 Chính Xác! Ong Vàng Nháy Mắt (+10 điểm)"
          : "🎉 Chính Xác Rồi! Ong Vàng Nháy Mắt (+5 điểm)";
        note.className = "correct-ans-note";
        note.textContent = `✔ Đáp án đúng là ${letters[qObj.answer]}: ${qObj.options[qObj.answer]}`;
        explainTitle.textContent = "📖 Giải thích:";
        explainText.textContent = qObj.explain;
        nextBtn.className = "btn-next correct";
        nextBtn.textContent = currentIdx === questions.length - 1 ? "Xem Kết Quả →" : "Câu tiếp theo →";
        videoWrap.className = "video-wrap bee-mode";
        videoEl.src = "video_1.mp4";
      } else {
        hasAttemptedCurrent = true;
        header.className = "modal-header wrong";
        header.textContent = "😼 Sai Rồi! Mèo Vàng Đang Lườm Kìa!";
        note.className = "wrong-ans-note";
        note.textContent = `✖ Bạn chọn ${letters[selectedIdx]} chưa chính xác. Hãy thử chọn lại nhé!`;
        explainTitle.textContent = "💡 Gợi ý cho bạn:";
        explainText.textContent = qObj.hint;
        nextBtn.className = "btn-next wrong";
        nextBtn.textContent = "↻ Làm lại câu này";
        videoWrap.className = "video-wrap cat-mode";
        videoEl.src = "video_2.mp4";
      }

      modal.classList.remove("hidden");
      videoEl.currentTime = 0;
      videoEl.play().catch(() => {});
    }

    function handleModalAction() {
      videoEl.pause();
      modal.classList.add("hidden");

      if (!isLastAnswerCorrect) {
        // Giữ nguyên câu hiện tại để người chơi chọn lại
        return;
      }

      hasAttemptedCurrent = false;
      currentIdx++;
      if (currentIdx < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      document.getElementById("final-score").textContent = score;
      const comment = document.getElementById("result-comment");
      if (score >= 60) {
        comment.textContent = "Xuất sắc! Bạn đã nắm rất chắc toàn bộ kiến thức Bài 7: Chiến lược phân phối.";
      } else if (score >= 40) {
        comment.textContent = "Khá tốt! Ôn lại thêm một chút phần phân loại kênh và xử lý mâu thuẫn là chuẩn bài.";
      } else {
        comment.textContent = "Hoàn thành thử thách! Chơi lại một lượt nữa để đạt điểm tối đa nhé!";
      }
    }

    document.getElementById("btn-start").addEventListener("click", startGame);
    document.getElementById("btn-restart").addEventListener("click", startGame);
    document.getElementById("btn-next").addEventListener("click", handleModalAction);
  </script>
</body>
</html>
